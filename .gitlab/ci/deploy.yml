# Stage 5: deploy to the small GCP VM (pull the image from the registry and run).
#
# Required group CI/CD variables (group sr-media-ai/adsum, protected + masked):
#   GCP_SA_KEY        base64 or JSON of a deploy service account (compute + ssh)
#   GCP_PROJECT       GCP project id
#   GCP_ZONE          for example europe-west1-b
#   ADSUM_VM_NAME     for example adsum-prod-01
#   ADSUM_DATABASE_URL, ADSUM_JWT_SECRET, ADSUM_CORS_ORIGINS  runtime env
#
# Deploys on a semantic version tag, manual trigger, so a release is deliberate.

.deploy_base:
  image: google/cloud-sdk:slim
  stage: deploy
  before_script:
    - echo "$GCP_SA_KEY" | base64 -d > /tmp/sa.json 2>/dev/null || echo "$GCP_SA_KEY" > /tmp/sa.json
    - gcloud auth activate-service-account --key-file=/tmp/sa.json
    - gcloud config set project "$GCP_PROJECT"

deploy:prod:
  extends: .deploy_base
  environment:
    name: production
    url: https://adsum-api.${ADSUM_BASE_DOMAIN}
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - IMAGE="${REGISTRY_BASE}/prod:${VERSION}"
    - |
      gcloud compute ssh "$ADSUM_VM_NAME" --zone "$GCP_ZONE" --tunnel-through-iap --command "
        set -e
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'
        docker pull '$IMAGE'
        docker rm -f adsum-api 2>/dev/null || true
        docker run -d --name adsum-api --restart unless-stopped -p 8080:8080 \
          -e ADSUM_DATABASE_URL='$ADSUM_DATABASE_URL' \
          -e ADSUM_JWT_SECRET='$ADSUM_JWT_SECRET' \
          -e ADSUM_CORS_ORIGINS='$ADSUM_CORS_ORIGINS' \
          '$IMAGE'
        docker image prune -f
      "
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
