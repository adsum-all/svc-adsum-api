[project]
name = "adsum-api"
version = "0.1.0"
description = "ADSUM business API (FastAPI): authentication and member endpoints on the real PostgreSQL."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
