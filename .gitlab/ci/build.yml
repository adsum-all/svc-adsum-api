# Stage 4: build and push the Docker image to the GitLab container registry.

.docker:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

# Dev image on every develop commit: dev:<sha> and dev:latest.
build:dev:
  extends: .docker
  stage: build
  script:
    - SHA="${CI_COMMIT_SHORT_SHA}"
    - |
      docker build \
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --build-arg VERSION="dev-${SHA}" \
        --build-arg VCS_REF="${CI_COMMIT_SHA}" \
        -f deploy/Dockerfile \
        -t "${REGISTRY_BASE}/dev:${SHA}" \
        -t "${REGISTRY_BASE}/dev:latest" \
        .
      docker push "${REGISTRY_BASE}/dev:${SHA}"
      docker push "${REGISTRY_BASE}/dev:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "feat/cicd-docker-registry"'

# Prod image on a semantic version tag: prod:X.Y.Z and prod:latest.
build:prod:
  extends: .docker
  stage: build
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      docker build \
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --build-arg VERSION="${VERSION}" \
        --build-arg VCS_REF="${CI_COMMIT_SHA}" \
        -f deploy/Dockerfile \
        -t "${REGISTRY_BASE}/prod:${VERSION}" \
        -t "${REGISTRY_BASE}/prod:latest" \
        .
      docker push "${REGISTRY_BASE}/prod:${VERSION}"
      docker push "${REGISTRY_BASE}/prod:latest"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
