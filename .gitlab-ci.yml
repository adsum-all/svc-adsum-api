# ADSUM API - thin pipeline. All reusable jobs live in the centralized
# deployment/ci-templates repository. This file only wires them and sets
# repo-specific variables (Constitution audit, ruff, pytest, official Docker
# build, security scans, GCP deploy). Tags: dev:<sha> on develop, prod:vX.Y.Z on tags.
stages:
  - validate
  - test
  - security
  - build
  - deploy

variables:
  DOCKERFILE_PATH: "deploy/Dockerfile"

# Continuous deployment to Vercel on develop activates once the protected CI/CD
# variable VERCEL_TOKEN is set (repo already holds .vercel/project.json).
include:
  - project: 'sr-media-ai/adsum/deployment/ci-templates'
    ref: develop
    file:
      - '/templates/python-ci.yml'
      - '/templates/security.yml'
      - '/templates/docker.yml'
      - '/templates/deploy-gcp.yml'
      - '/templates/deploy-web.yml'
