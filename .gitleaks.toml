# Gitleaks configuration for adsum-api. Keeps all default rules and adds an
# allowlist for test fixtures and the public QR token format, which are not real
# secrets. No production secret is ever committed (they live outside the repo).
title = "ADSUM API gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures, the public ADSUM1 QR token format and documented key shapes"
paths = [
  '''tests/.*''',
]
regexes = [
  '''ADSUM1\.[A-Za-z0-9_.\-]+''',
  # The integrations screen tells an administrator which SHAPE of key to paste,
  # because Brevo issues both an API key and an SMTP key and pasting the wrong one
  # fails silently. Naming the prefix is the whole point of that help text, and the
  # scanner's Brevo rule matches the prefix alone.
  #
  # Written to match the documented form only, the prefix followed by an ellipsis.
  # Allowing every "xkeysib-" would blind the scanner to a real key committed by
  # accident, which is the one thing it exists to catch.
  '''xkeysib-\.\.\.''',
]
