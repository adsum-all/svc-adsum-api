# Stage 2: tests - unit tests (Argon2, JWT). Integration login tests are skipped
# without a database, so the pipeline never depends on production secrets.

test:pytest:
  stage: test
  image: python:3.11-slim
  script:
    - pip install --quiet -r requirements.txt
    - pip install --quiet pytest
    - pytest -q
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
