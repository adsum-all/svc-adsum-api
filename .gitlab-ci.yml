# =============================================================
# ADSUM API - GitLab CI/CD (modular pipeline, .gitlab/ci/*.yml)
#
# Container registry: ${CI_REGISTRY_IMAGE}
#   dev:<sha>, dev:latest    (develop branch)
#   prod:X.Y.Z, prod:latest  (tag vX.Y.Z, built from main)
#
# Flow:
#   develop       -> validate, test, security, build dev image
#   tag vX.Y.Z    -> validate, test, security, build prod image, deploy (manual)
#   merge request -> validate, test, security
# =============================================================

stages:
  - validate
  - test
  - security
  - build
  - deploy

variables:
  DOCKER_BUILDKIT: "1"
  REGISTRY_BASE: "${CI_REGISTRY_IMAGE}"

include:
  - local: '.gitlab/ci/validate.yml'
  - local: '.gitlab/ci/test.yml'
  - local: '.gitlab/ci/security.yml'
  - local: '.gitlab/ci/build.yml'
  - local: '.gitlab/ci/deploy.yml'
