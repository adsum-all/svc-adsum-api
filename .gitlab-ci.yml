# ADSUM API - thin pipeline. All reusable jobs live in the centralized
# deployment/ci-templates repository. This file only wires them and sets
# repo-specific variables (Constitution audit, ruff, pytest, official Docker
# build, security scans, GCP deploy). Tags: dev:<sha> on develop, prod:vX.Y.Z on tags.
stages:
  - validate
  - test
  - security
  - build
  - deploy

variables:
  DOCKERFILE_PATH: "deploy/Dockerfile"

# Continuous deployment to Vercel on develop activates once the protected CI/CD
# variable VERCEL_TOKEN is set (repo already holds .vercel/project.json).
include:
  - project: 'sr-media-ai/adsum/deployment/ci-templates'
    ref: main
    file:
      - '/templates/python-ci.yml'
      - '/templates/security.yml'
      - '/templates/docker.yml'
      - '/templates/deploy-gcp.yml'
      - '/templates/deploy-web.yml'

# À ajouter dès que la demande de fusion ci-templates !6 est sur `main` :
#
#       - '/templates/policies.yml'
#
# Ces deux tâches comparent la table de routage réelle aux deux politiques d'accès et
# vérifient que la copie versée dans policies/ n'a pas dérivé de l'exemplaire faisant
# foi. L'inclure avant la fusion ferait échouer le chargement de la configuration, et
# le pipeline tomberait sans créer la moindre tâche, pour une raison qui n'a rien à
# voir avec ce dépôt. En attendant, les deux tests tournent avec le reste de la suite,
# `tests/test_conformite_politiques.py` n'ayant besoin d'aucune tâche particulière.

# The shared template runs the secret scan quietly: it prints "leaks found: 1" and
# nothing else, so nobody can tell a real credential from a format example without
# installing the scanner and running it by hand. One wrong fix has already been made
# on that guess. The same improvement is proposed to the shared template; until it
# lands on main, this repository asks its own scan to say what it found.
#
# --redact stays, so the value itself never reaches the log, which is the point of
# scanning for it. Only the rule, the file and the line become visible.
security:gitleaks:
  script:
    - gitleaks detect --source . --no-banner --redact --verbose --exit-code 1
