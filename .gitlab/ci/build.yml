# Stage 4: build and push the Docker image to the GitLab container registry.
# Built with Kaniko (no Docker daemon, no privileged runner), reliable on SaaS.

.kaniko:
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json

# Dev image on every develop commit: dev:<sha> and dev:latest.
build:dev:
  extends: .kaniko
  stage: build
  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/deploy/Dockerfile"
      --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --build-arg VERSION="dev-${CI_COMMIT_SHORT_SHA}"
      --build-arg VCS_REF="${CI_COMMIT_SHA}"
      --destination "${REGISTRY_BASE}/dev:${CI_COMMIT_SHORT_SHA}"
      --destination "${REGISTRY_BASE}/dev:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "feat/cicd-docker-registry"'

# Prod image on a semantic version tag: prod:X.Y.Z and prod:latest.
build:prod:
  extends: .kaniko
  stage: build
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/deploy/Dockerfile"
      --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --build-arg VERSION="${VERSION}"
      --build-arg VCS_REF="${CI_COMMIT_SHA}"
      --destination "${REGISTRY_BASE}/prod:${VERSION}"
      --destination "${REGISTRY_BASE}/prod:latest"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
